# Camjo: builds Camjo Time for Windows and macOS against the UI components from
# Camjo-AB/solidtime (branch camjo), so web and desktop share the same changes.
# Push to camjo -> installers as workflow artifacts.
# Push a tag vX.Y.Z -> also a public GitHub release, which time.camjo.com/download
# and the in-app updater read from.
# Builds are unsigned until Camjo has an Apple Developer account and a Windows certificate.
name: Camjo - Build and release

on:
    push:
        branches:
            - camjo
        tags:
            - 'v*.*.*'
    workflow_dispatch:

permissions:
    contents: write

jobs:
    ui-package:
        runs-on: ubuntu-latest
        steps:
            - name: Check out Camjo-AB/solidtime
              uses: actions/checkout@v4
              with:
                  repository: Camjo-AB/solidtime
                  ref: camjo

            - name: Install Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20

            - name: Install root dependencies
              run: npm ci

            - name: Install package dependencies
              run: npm ci
              working-directory: ./resources/js/packages/ui

            - name: Build and pack @solidtime/ui
              run: |
                  npm run build
                  mkdir -p "${{ runner.temp }}/ui"
                  npm pack --pack-destination "${{ runner.temp }}/ui"
              working-directory: ./resources/js/packages/ui

            - name: Upload package
              uses: actions/upload-artifact@v4
              with:
                  name: solidtime-ui
                  path: ${{ runner.temp }}/ui/*.tgz
                  if-no-files-found: error

    build:
        needs: ui-package
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: macos-latest
                      platform: mac
                      arch: arm64
                    - os: macos-15-intel
                      platform: mac
                      arch: x64
                    - os: windows-latest
                      platform: windows
                      arch: x64

        steps:
            - name: Check out Git repository
              uses: actions/checkout@v4

            - name: Install Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Download @solidtime/ui package
              uses: actions/download-artifact@v4
              with:
                  name: solidtime-ui
                  path: ${{ runner.temp }}/ui

            - name: Set version from tag
              if: startsWith(github.ref, 'refs/tags/v')
              shell: bash
              run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version

            - name: Install dependencies
              shell: bash
              run: |
                  npm install
                  npm install --no-save "$(ls "${{ runner.temp }}"/ui/*.tgz)"

            - name: Build
              run: npm run build

            - name: Run Electron Builder (Windows)
              if: matrix.platform == 'windows'
              run: npx electron-builder --windows --${{ matrix.arch }} --publish never

            - name: Run Electron Builder (macOS)
              if: matrix.platform == 'mac'
              run: npx electron-builder --mac --${{ matrix.arch }} --publish never -c.mac.notarize=false
              env:
                  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

            - name: Upload installers
              uses: actions/upload-artifact@v4
              with:
                  name: release-${{ matrix.platform }}-${{ matrix.arch }}
                  path: |
                      dist/*.dmg
                      dist/*-mac.zip
                      dist/*.exe
                      dist/*.blockmap
                      dist/latest-*.yml
                  if-no-files-found: error
                  retention-days: 14

    release:
        if: startsWith(github.ref, 'refs/tags/v')
        needs: build
        runs-on: ubuntu-latest
        steps:
            - name: Check out Git repository
              uses: actions/checkout@v4

            - name: Install Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Install yaml package
              run: npm install --no-save --ignore-scripts yaml

            - name: Download all release artifacts
              uses: actions/download-artifact@v4
              with:
                  path: release-artifacts
                  pattern: release-*
                  merge-multiple: true

            - name: Merge update yml files
              run: |
                  cd release-artifacts
                  node ../scripts/merge-update-ymls.js --prefer-arch arm64 latest-mac.yml latest-arm64-mac.yml latest-x64-mac.yml
                  cp latest-x64.yml latest.yml
                  ls -la

            - name: Create GitHub release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release create "$GITHUB_REF_NAME" release-artifacts/* \
                      --title "Camjo Time ${GITHUB_REF_NAME#v}" \
                      --notes "Download: https://time.camjo.com/download"
